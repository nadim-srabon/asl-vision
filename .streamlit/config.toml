[theme]
base = "dark"
primaryColor = "#9334e9"
backgroundColor = "#120b1b"
secondaryBackgroundColor = "#1d1429"
textColor = "#fafafa"
font = "Raleway:https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap"
codeFont = "Raleway:https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap"
headingFont = "Raleway:https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap"
borderColor = "#3a2d4f"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
